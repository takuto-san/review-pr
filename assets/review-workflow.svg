<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1040" viewBox="0 0 1400 1040" role="img" aria-labelledby="title desc">
  <title id="title">Review PR workflow</title>
  <desc id="desc">A review workflow whose four result paths all terminate at the same top-center point of the Combine results and check fix candidates step.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4b5563"/>
    </marker>
    <style>
      .node { fill: #f3f0ff; stroke: #8b7cf6; stroke-width: 2; }
      .edge { fill: none; stroke: #4b5563; stroke-width: 2; marker-end: url(#arrow); stroke-linejoin: miter; }
      .merge-edge { fill: none; stroke: #4b5563; stroke-width: 2; stroke-linejoin: miter; }
      .label { fill: #20242c; font: 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-anchor: middle; }
      .edge-label { fill: #4b5563; font: 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-anchor: middle; paint-order: stroke; stroke: white; stroke-width: 5px; stroke-linejoin: round; }
    </style>
  </defs>

  <!-- Nodes -->
  <rect class="node" x="550" y="20" width="300" height="60" rx="3"/>
  <text class="label" x="700" y="57">Load PR or local changes</text>

  <polygon class="node" points="700,105 850,155 700,205 550,155"/>
  <text class="label" x="700" y="161">Should the review run?</text>

  <rect class="node" x="70" y="245" width="300" height="70" rx="3"/>
  <text class="label" x="220" y="274">
    <tspan x="220">Explain why the review</tspan>
    <tspan x="220" dy="23">was skipped</tspan>
  </text>

  <rect class="node" x="480" y="245" width="340" height="70" rx="3"/>
  <text class="label" x="650" y="274">
    <tspan x="650">Collect change intent and</tspan>
    <tspan x="650" dy="23">supporting context</tspan>
  </text>

  <polygon class="node" points="1120,210 1250,260 1120,310 990,260"/>
  <text class="label" x="1120" y="255">
    <tspan x="1120">Can automated</tspan>
    <tspan x="1120" dy="23">checks run?</tspan>
  </text>

  <rect class="node" x="480" y="365" width="340" height="70" rx="3"/>
  <text class="label" x="650" y="394">
    <tspan x="650">Assess scope and build the</tspan>
    <tspan x="650" dy="23">review plan</tspan>
  </text>

  <polygon class="node" points="650,465 800,520 650,575 500,520"/>
  <text class="label" x="650" y="515">
    <tspan x="650">Can each planned</tspan>
    <tspan x="650" dy="23">review run?</tspan>
  </text>

  <rect class="node" x="45" y="640" width="300" height="70" rx="3"/>
  <text class="label" x="195" y="669">
    <tspan x="195">Review code behavior</tspan>
    <tspan x="195" dy="23">and design</tspan>
  </text>

  <rect class="node" x="390" y="640" width="300" height="70" rx="3"/>
  <text class="label" x="540" y="669">
    <tspan x="540">Compare the implementation</tspan>
    <tspan x="540" dy="23">with requirements</tspan>
  </text>

  <rect class="node" x="825" y="640" width="260" height="70" rx="3"/>
  <text class="label" x="955" y="669">
    <tspan x="955">Run eligible tests and</tspan>
    <tspan x="955" dy="23">static checks</tspan>
  </text>

  <rect class="node" x="1110" y="640" width="250" height="70" rx="3"/>
  <text class="label" x="1235" y="669">
    <tspan x="1235">Record work that</tspan>
    <tspan x="1235" dy="23">could not run</tspan>
  </text>

  <rect class="node" x="510" y="850" width="380" height="70" rx="3"/>
  <text class="label" x="700" y="879">
    <tspan x="700">Combine results and check</tspan>
    <tspan x="700" dy="23">fix candidates</tspan>
  </text>

  <rect class="node" x="510" y="970" width="380" height="60" rx="3"/>
  <text class="label" x="700" y="1007">Present the final review report</text>

  <!-- Workflow edges; every bend is orthogonal. -->
  <path class="edge" d="M700 80 V105"/>
  <path class="edge" d="M550 155 H220 V245"/>
  <text class="edge-label" x="410" y="145">No</text>
  <path class="edge" d="M700 205 V225 H650 V245"/>
  <text class="edge-label" x="724" y="232">Yes</text>
  <path class="edge" d="M850 155 H1120 V210"/>
  <text class="edge-label" x="940" y="145">Yes</text>
  <path class="edge" d="M650 315 V365"/>
  <path class="edge" d="M650 435 V465"/>
  <path class="edge" d="M1120 310 V610 H955 V640"/>
  <text class="edge-label" x="1095" y="350">Yes</text>
  <path class="edge" d="M1250 260 H1325 V620 H1235 V640"/>
  <text class="edge-label" x="1305" y="290">No</text>
  <path class="edge" d="M500 520 H195 V640"/>
  <path class="edge" d="M650 575 V610 H540 V640"/>
  <path class="edge" d="M800 520 H1235 V640"/>
  <text class="edge-label" x="930" y="509">Unavailable</text>

  <!-- Each result path bends once, then all four meet at x=700, y=800. -->
  <path class="merge-edge" d="M195 710 V800 H700"/>
  <path class="merge-edge" d="M540 710 V800 H700"/>
  <path class="merge-edge" d="M955 710 V800 H700"/>
  <path class="merge-edge" d="M1235 710 V800 H700"/>
  <path class="edge" d="M700 800 V850"/>

  <path class="edge" d="M700 920 V970"/>
</svg>
