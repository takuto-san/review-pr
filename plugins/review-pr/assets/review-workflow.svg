<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1050" viewBox="0 0 1200 1050" role="img" aria-labelledby="title desc">
  <title id="title">Review PR plan and run workflow</title>
  <desc id="desc">Plan resolves the target, collects context, and shows planned review coverage. After human approval, run validates the unchanged target, performs three review layers, and reports AI coverage, issues, and human handoffs.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#475569"/></marker>
    <style>
      .phase{fill:#e0e7ff;stroke:#6366f1;stroke-width:2}.box{fill:#f8fafc;stroke:#94a3b8;stroke-width:2}.gate{fill:#fef3c7;stroke:#d97706;stroke-width:2}.result{fill:#dcfce7;stroke:#16a34a;stroke-width:2}.line{fill:none;stroke:#475569;stroke-width:2;marker-end:url(#arrow)}.label{fill:#0f172a;font:20px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;text-anchor:middle}.small{font-size:16px;fill:#475569}
    </style>
  </defs>
  <rect class="phase" x="430" y="20" width="340" height="54" rx="8"/><text class="label" x="600" y="55">review-pr plan</text>
  <rect class="box" x="370" y="110" width="460" height="75" rx="8"/><text class="label" x="600" y="140"><tspan x="600">Resolve PR or local snapshot</tspan><tspan class="small" x="600" dy="25">Check eligibility and record fingerprint</tspan></text>
  <rect class="box" x="370" y="225" width="460" height="75" rx="8"/><text class="label" x="600" y="255"><tspan x="600">Collect context and assess scope</tspan><tspan class="small" x="600" dy="25">Intent, before/after, dependencies, decisions</tspan></text>
  <rect class="box" x="370" y="340" width="460" height="75" rx="8"/><text class="label" x="600" y="370"><tspan x="600">Build Planned Review Coverage</tspan><tspan class="small" x="600" dy="25">REVIEW.md + context → shared criteria</tspan></text>
  <rect class="gate" x="370" y="455" width="460" height="75" rx="8"/><text class="label" x="600" y="485"><tspan x="600">Show plan and stop</tspan><tspan class="small" x="600" dy="25">User approves or requests edits</tspan></text>
  <rect class="phase" x="430" y="570" width="340" height="54" rx="8"/><text class="label" x="600" y="605">review-pr run</text>
  <rect class="box" x="370" y="660" width="460" height="75" rx="8"/><text class="label" x="600" y="690"><tspan x="600">Validate saved plan and snapshot</tspan><tspan class="small" x="600" dy="25">Changed target → create a new plan</tspan></text>
  <rect class="box" x="70" y="775" width="300" height="70" rx="8"/><text class="label" x="220" y="815">Mechanical checks</text>
  <rect class="box" x="450" y="775" width="300" height="70" rx="8"/><text class="label" x="600" y="815">Structural review</text>
  <rect class="box" x="830" y="775" width="300" height="70" rx="8"/><text class="label" x="980" y="815">Contextual review</text>
  <rect class="result" x="370" y="895" width="460" height="110" rx="8"/><text class="label" x="600" y="925"><tspan x="600">Consolidate by criterion</tspan><tspan class="small" x="600" dy="25">AI Verified · Please Fix · Need Review</tspan><tspan class="small" x="600" dy="24">Show coverage and human handoff</tspan></text>
  <path class="line" d="M600 74 V110"/><path class="line" d="M600 185 V225"/><path class="line" d="M600 300 V340"/><path class="line" d="M600 415 V455"/><path class="line" d="M600 530 V570"/><path class="line" d="M600 624 V660"/>
  <path class="line" d="M520 735 V755 H220 V775"/><path class="line" d="M600 735 V775"/><path class="line" d="M680 735 V755 H980 V775"/>
  <path class="line" d="M220 845 V870 H520 V895"/><path class="line" d="M600 845 V895"/><path class="line" d="M980 845 V870 H680 V895"/>
</svg>
